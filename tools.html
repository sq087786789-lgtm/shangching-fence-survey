<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="上慶企業社工具總入口：圍籬配置、現場勘查、進銷存、裝車助手與名片管家。">
  <title>上慶工具入口</title>
  <style>
    :root{color-scheme:light;--ink:#172b46;--muted:#54657a;--line:#dbe3ed;--blue:#1d4ed8}
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}a{color:var(--blue)}a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid #f59e0b;outline-offset:4px}main{max-width:1120px;margin:auto;padding:42px 24px}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.mark{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:14px;color:white;background:#172b46;font-weight:800;font-size:23px}h1{font-size:30px;line-height:1.3;margin:0}header p{margin:5px 0 0;color:var(--muted);font-size:14px}.lead{padding:14px 18px;background:#eaf1ff;border:1px solid #c9dbff;border-radius:12px;margin-bottom:24px}.lead strong{color:#1e40af}.lead p{margin:3px 0 0;font-size:14px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.card:hover{border-color:#9ab8ed;box-shadow:0 5px 18px #172b460a}.open{display:flex;flex:1;flex-direction:column;padding:22px;color:inherit;text-decoration:none}.cardHead{display:flex;align-items:center;gap:10px}.icon{display:grid;place-items:center;flex:none;width:38px;height:38px;background:#eff4fd;color:#1d4ed8;border-radius:10px;font-size:19px;font-weight:800}.tag{font-size:12px;color:#54657a}h2{margin:14px 0 8px;font-size:20px;line-height:1.4}.open p{margin:0 0 20px;font-size:14px;color:var(--muted)}.go{margin-top:auto;color:var(--blue);font-size:14px;font-weight:750}.repo{padding:10px 22px;border-top:1px solid #edf1f6;font-size:12px;text-decoration:none;color:#65758a}.repo:hover{text-decoration:underline}.legacy{margin-top:26px;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.legacy summary{cursor:pointer;min-height:32px;font-weight:650;color:var(--muted)}.legacy .grid{margin-top:14px}.legacy .icon{background:#f1f3f5;color:#64748b}.note{color:var(--muted);font-size:13px;margin:25px 0 0}footer{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}footer a{text-decoration:none}#loadStatus{font-size:14px;color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){main{padding:24px 16px}h1{font-size:25px}.grid{grid-template-columns:minmax(0,1fr);gap:12px}.open{padding:18px}h2{margin-top:10px}.repo{padding:12px 18px;min-height:44px}.lead{padding:12px 14px}footer a{display:inline-flex;align-items:center;min-height:44px}}
  </style>
  <script src="tools.js" defer></script>
</head>
<body>
<main>
  <header><div class="mark" aria-hidden="true">慶</div><div><h1>上慶工具入口</h1><p>所有工具，從這裡開啟。</p></div></header>
  <div class="lead"><strong>圍籬配置請選「目前維護版」</strong><p>新功能持續更新在同一個網址，舊版工具另收在下方。</p></div>
  <p id="loadStatus" role="status">正在載入工具清單…</p>
  <section class="grid" id="currentTools" aria-label="目前工具"></section>
  <details class="legacy" id="legacySection" hidden><summary>舊版工具</summary><div class="grid" id="legacyTools"></div></details>
  <noscript><p>請啟用 JavaScript 以顯示工具清單。<a href="studio.html">直接開啟新版圍籬工作室</a>。</p></noscript>
  <p class="note">這裡統一管理工具入口，各工具保留自己的專案與資料。請在各工具內定期匯出案件備份；入口不會合併或搬移你的資料。</p>
  <footer><a href="https://github.com/sq087786789-lgtm">所有 GitHub 專案 ↗</a><a href="https://github.com/sq087786789-lgtm/shangching-fence-survey/blob/main/tools.json">管理入口清單 ↗</a><a href="https://www.hongsing.com.tw/">上慶官網 ↗</a></footer>
</main>
</body>
</html>
